name: RouterUsageWidget
options:
  minimumXcodeGenVersion: 2.40.0
  projectFormat: xcode15_0
  xcodeVersion: "15.0"
  deploymentTarget:
    macOS: "14.0"
  # Simplified Chinese ships as a resource folder because the widget's
  # AppIntents metadata (gallery title and description, and the "Usage Source"
  # parameter name) is localized by the framework from the extension bundle and
  # cannot read the Swift table that the rendered text uses. Anything listed
  # here is picked up as a localization; the .lproj stays the source of truth.
  knownLocalizations:
    - en
    - zh-Hans
settings:
  base:
    CLANG_ENABLE_MODULES: YES
    SDKROOT: macosx
    SWIFT_VERSION: "5.0"
targets:
  RouterUsageWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: RouterUsageWidget
      - path: ../ModelRouterTray/Sources/RouterWidgetSnapshot.swift
        group: Shared
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: RouterUsageWidget/RouterUsageWidget.entitlements
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RouterUsageWidget/Info.plist
        MARKETING_VERSION: "0.1.0"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.codex-router.tray.widget
        PRODUCT_NAME: RouterUsageWidget
        SKIP_INSTALL: YES
  RouterUsageWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RouterUsageWidgetTests
      - path: RouterUsageWidget/RouterUsageWidget.swift
      - path: ../ModelRouterTray/Sources/RouterWidgetSnapshot.swift
        group: Shared
    settings:
      base:
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.codex-router.tray.widget.tests
schemes:
  RouterUsageWidget:
    build:
      targets:
        RouterUsageWidget: all
    test:
      targets:
        - RouterUsageWidgetTests
      environmentVariables:
        ROUTER_WIDGET_SCREENSHOT_DIR: $(ROUTER_WIDGET_SCREENSHOT_DIR)
