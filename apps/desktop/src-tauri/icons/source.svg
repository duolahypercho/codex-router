  <!-- One request enters, three providers are reachable, one is selected.
       The dimmed outer branches carry the whole idea of a router; without
       them this is just an arrow. -->
  <g fill="none" stroke="url(#signal)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-opacity="0.34">
      <path d="M 470 512 C 566 512, 590 330, 686 330"/>
      <path d="M 470 512 C 566 512, 590 694, 686 694"/>
    </g>
    <path d="M 300 512 L 686 512"/>
  </g>

  <g fill="url(#signal)">
    <circle cx="300" cy="512" r="44"/>
    <circle cx="724" cy="330" r="40" fill-opacity="0.34"/>
    <circle cx="724" cy="694" r="40" fill-opacity="0.34"/>
  </g>

  <!-- Selected endpoint: the only element allowed to glow, so the eye lands
       on the routing decision rather than on the fan. -->
  <circle cx="724" cy="512" r="112" fill="url(#activeGlow)"/>
  <circle cx="724" cy="512" r="52" fill="#7DEFFC"/>
</svg>
