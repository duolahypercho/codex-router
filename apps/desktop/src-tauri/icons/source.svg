<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Model Router">
  <title>Model Router</title>

  <defs>
    <!-- Tile: near-black with a cool lift toward the top-left, so the glyph's
         blue reads as emitted light rather than as paint on grey. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1B2230"/>
      <stop offset="0.55" stop-color="#0E131C"/>
      <stop offset="1" stop-color="#05070C"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.28" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#7FA6FF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#7FA6FF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#7FA6FF" stop-opacity="0"/>
    </radialGradient>

    <!-- One gradient across the whole glyph so the fan reads as a single
         signal travelling left to right, not three separate strokes. -->
    <linearGradient id="signal" x1="256" y1="738" x2="768" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2F5CF0"/>
      <stop offset="0.5" stop-color="#4C8DF7"/>
      <stop offset="1" stop-color="#72ECFB"/>
    </linearGradient>

    <!-- A radial halo rather than feGaussianBlur. CoreSVG (what sips and every
         macOS thumbnailer use to rasterize this file) drops SVG filter
         primitives silently, so the glow simply vanished from the generated
         PNGs. A gradient is also steadier at 32 px, where a real blur turns
         the endpoint into a smudge. -->
    <radialGradient id="activeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.46" stop-color="#7DEFFC" stop-opacity="0.26"/>
      <stop offset="0.68" stop-color="#5BC8F5" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#5BC8F5" stop-opacity="0"/>
    </radialGradient>

