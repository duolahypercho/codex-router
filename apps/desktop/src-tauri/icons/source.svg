    </clipPath>
  </defs>

  <!-- The tile is a true superellipse, not a rounded rect: next to Apple's own
       icons in the Dock a circular-corner tile reads as slightly pinched. -->
  <g clip-path="url(#tileClip)">
    <rect x="100" y="100" width="824" height="824" fill="url(#tile)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>

