name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

jobs:
  release-preflight:
    name: Verify release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Require the exact tested main commit and package version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          main_commit=$(git rev-parse origin/main)
          test "$tag_commit" = "$GITHUB_SHA"
          test "$tag_commit" = "$main_commit"
          package_version=$(node -p 'require("./package.json").version')
          test "v$package_version" = "$GITHUB_REF_NAME"

          for _ in {1..120}; do
            successful_runs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))] | length')
            if [ "$successful_runs" -gt 0 ]; then
              exit 0
            fi
            sleep 15
          done
          echo "No successful CI run completed for exact release commit $GITHUB_SHA." >&2
          exit 1

  unified-app:
    name: Unsigned tester app (${{ matrix.platform }})
    needs: release-preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Build the unsigned tester application
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p staged
          npm ci --prefix apps/control-center
          npm run check --prefix apps/control-center
          npm test --prefix apps/control-center
          npm run build --prefix apps/control-center
          if [ "$RUNNER_OS" = Windows ]; then
            (cd apps/control-center && npx --no-install electron-builder --win --publish never)
            mapfile -t installers < <(find apps/control-center/release -maxdepth 1 -type f -name '*.exe' -print)
            test "${#installers[@]}" -eq 1
            cp "${installers[0]}" \
              "staged/model-router-${version}-windows-x64.exe"
          else
            (cd apps/control-center && npx --no-install electron-builder --linux --publish never)
            mapfile -t appimages < <(find apps/control-center/release -maxdepth 1 -type f -name '*.AppImage' -print)
            test "${#appimages[@]}" -eq 1
            package_dir="$RUNNER_TEMP/model-router-linux-package"
            package_name="model-router-${version}-linux-x64.AppImage"
            mkdir -p "$package_dir"
            install -m 0755 "${appimages[0]}" "$package_dir/$package_name"
            tar -czf "staged/model-router-${version}-linux-x64.tar.gz" \
              -C "$package_dir" "$package_name"
          fi
      - name: Smoke the packaged Linux application
        if: runner.os == 'Linux'
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum bash -s <<'SMOKE'
          set -euo pipefail
          app="./apps/control-center/release/linux-unpacked/codex-router-control-center"
          log="${RUNNER_TEMP}/control-center-linux-release.log"
          "$app" --no-sandbox --tray-only >"$log" 2>&1 &
          pid=$!
          trap 'kill -KILL "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            cat "$log"
            echo "Packaged Linux app exited early with status $status." >&2
            exit 1
          fi
          "$app" --no-sandbox
          sleep 2
          kill -0 "$pid"
          "$app" --no-sandbox --quit-for-update
          for _ in {1..60}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              if wait "$pid"; then status=0; else status=$?; fi
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                cat "$log"
                echo "Packaged Linux app stopped with status $status." >&2
                exit 1
              fi
              exit 0
            fi
            sleep 0.25
          done
          cat "$log"
          echo "Packaged Linux app did not stop after controlled quit." >&2
          exit 1
          SMOKE
      - name: Smoke the packaged Windows application
        if: runner.os == 'Windows'
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "control-center-windows-release.log"
          $stderr = Join-Path $env:RUNNER_TEMP "control-center-windows-release-error.log"
          $app = ".\apps\control-center\release\win-unpacked\Codex Router.exe"
          $process = Start-Process $app -ArgumentList "--tray-only" -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Packaged Windows app exited early with status $($process.ExitCode)."
            }
            $open = Start-Process $app -PassThru
            if (-not $open.WaitForExit(10000) -or $open.ExitCode -ne 0) {
              throw "Second launch did not hand off to the running app."
            }
            Start-Sleep -Seconds 2
            $process.Refresh()
            if (-not $process.CloseMainWindow()) { throw "Second launch did not expose the Control Center window." }
            Start-Sleep -Seconds 2
            $process.Refresh()
            if ($process.HasExited) { throw "Closing the window also killed the tray process." }
            $quit = Start-Process $app -ArgumentList "--quit-for-update" -PassThru
            if (-not $quit.WaitForExit(10000) -or $quit.ExitCode -ne 0) {
              throw "Controlled quit request failed."
            }
            if (-not $process.WaitForExit(15000)) { throw "Tray process did not stop after controlled quit." }
            if ($process.ExitCode -ne 0) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Packaged Windows app stopped with status $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
            }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: unified-app-${{ matrix.platform }}
          path: staged/*
          if-no-files-found: error

  unified-app-macos:
    name: Signed and notarized macOS app
    needs: release-preflight
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Detect macOS release credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          available=true
          for name in \
            MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY \
            MACOS_NOTARY_APPLE_ID MACOS_NOTARY_PASSWORD MACOS_TEAM_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "macOS release asset disabled because $name is not configured."
              available=false
            fi
          done
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - name: Import Developer ID certificate
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/codex-router-signing.keychain-db"
          certificate="$RUNNER_TEMP/codex-router-signing.p12"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v -p codesigning "$keychain"
      - name: Build universal Developer ID application
        if: steps.credentials.outputs.available == 'true'
        env:
          MODEL_ROUTER_TRAY_UNIVERSAL: "1"
          MODEL_ROUTER_PORTABLE_APP: "1"
          MODEL_ROUTER_CODESIGN_IDENTITY: ${{ env.MACOS_SIGNING_IDENTITY }}
        shell: bash
        run: scripts/build-macos-tray-app.sh "$RUNNER_TEMP/Codex Router.app"
      - name: Smoke the signed native host and embedded renderer
        if: steps.credentials.outputs.available == 'true'
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
          MODEL_ROUTER_SKIP_SERVICE_MANAGER: "1"
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Codex Router.app"
          outer="$app/Contents/MacOS/ModelRouterTray"
          embedded="$app/Contents/Resources/Control Center.app/Contents/MacOS/Codex Router"
          log="$RUNNER_TEMP/model-router-macos-signed-smoke.log"
          "$outer" --supervised > "$log" 2>&1 &
          pid=$!
          cleanup() {
            /usr/bin/osascript -l JavaScript -e '
              ObjC.import("AppKit");
              for (const identifier of ["io.github.codex-router.control-center", "io.github.codex-router.tray"]) {
                const apps = $.NSRunningApplication.runningApplicationsWithBundleIdentifier(identifier);
                for (let index = 0; index < apps.count; index += 1) apps.objectAtIndex(index).terminate;
              }
            ' >/dev/null 2>&1 || true
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1
          kill -0 "$pid"
          /usr/bin/open "$app"
          ready=false
          for _ in {1..120}; do
            state=$(/usr/bin/env -u ELECTRON_RUN_AS_NODE "$embedded" --query-lifecycle 2>/dev/null || true)
            if node -e '
              try {
                const state = JSON.parse(process.argv[1]);
                process.exit(state.running && state.ready && state.visible ? 0 : 1);
              } catch { process.exit(1); }
            ' "$state"; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [ "$ready" != true ]; then
            cat "$log"
            echo "Signed embedded Control Center did not become ready." >&2
            exit 1
          fi
          kill -0 "$pid"
          cleanup
          trap - EXIT
      - name: Notarize, staple, validate, and package
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Codex Router.app"
          submission="$RUNNER_TEMP/codex-router-notary.zip"
          version="${GITHUB_REF_NAME#v}"
          asset="staged/model-router-${version}-macos-universal.zip"
          mkdir -p staged
          ditto -c -k --keepParent "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --team-id "$MACOS_TEAM_ID" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --deep --strict \
            --requirements '=anchor apple generic and certificate leaf[field.1.2.840.113635.100.6.1.13] exists' \
            "$app"
          spctl --assess --type execute --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "$asset"
      - uses: actions/upload-artifact@v7
        if: steps.credentials.outputs.available == 'true'
        with:
          name: unified-app-macos
          path: staged/*
          if-no-files-found: error

  release:
    needs: [release-preflight, unified-app, unified-app-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node -p 'require("./package.json").version')
          test "v$package_version" = "$GITHUB_REF_NAME"
      - name: Build source archives
        shell: bash
        run: |
          mkdir -p dist
          prefix="codex-router-${GITHUB_REF_NAME#v}/"
          git archive --format=tar.gz --prefix="$prefix" -o "dist/codex-router-${GITHUB_REF_NAME#v}.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix="$prefix" -o "dist/codex-router-${GITHUB_REF_NAME#v}.zip" "$GITHUB_REF_NAME"
      - name: Collect unified platform apps
        uses: actions/download-artifact@v8
        with:
          pattern: unified-app-*
          path: dist
          merge-multiple: true
      - name: Checksum every asset
        shell: bash
        run: |
          cd dist
          sha256sum codex-router-* model-router-* > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if compgen -G 'dist/model-router-*-macos-universal.zip' >/dev/null; then
            mac_note="The macOS universal app is Developer ID signed, notarized, stapled, checksum-verified by the updater, and must match the installed router's tray-source fingerprint."
          else
            mac_note="No macOS app is attached because the repository's Developer ID or notarization credentials are not configured."
          fi
          warning="The Windows and Linux desktop packages are unsigned tester artifacts. Install the matching Codex Router version before running them. $mac_note"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --notes "$warning"
      - name: Update Homebrew formula
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          tarball="codex-router-${version}.tar.gz"
          sha=$(awk -v file="$tarball" '$2 == file { print $1 }' dist/SHA256SUMS)
          test -n "$sha"
          git fetch origin main
          git checkout -B main origin/main
          node packaging/homebrew/generate-formula.mjs \
            --version "$version" \
            --source-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${tarball}" \
            --source-sha256 "$sha" \
            --output Formula/codex-router.rb
          if git diff --quiet -- Formula/codex-router.rb; then
            echo "Formula already matches ${GITHUB_REF_NAME}."
            exit 0
          fi
          git add Formula/codex-router.rb
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: update Homebrew formula for ${GITHUB_REF_NAME}"
          git push origin main
