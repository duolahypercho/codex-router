name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Chromium for the browser panel E2E
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Test the macOS tray
        if: runner.os == 'macOS'
        working-directory: apps/macos/ModelRouterTray
        run: swift test
      - name: Test the macOS widget
        if: runner.os == 'macOS'
        working-directory: apps/macos/RouterUsageWidget
        run: xcodebuild -project RouterUsageWidget.xcodeproj -scheme RouterUsageWidget -destination 'platform=macOS' test CODE_SIGNING_ALLOWED=NO
      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: for file in install.sh bin/* scripts/build-electron-companion.sh scripts/build-macos-tray-app.sh scripts/build-macos-widget.sh packaging/homebrew/check-core-readiness.sh; do [ "$(head -n 1 "$file")" != '#!/bin/sh' ] || sh -n "$file"; done
      - name: Check installer help
        if: runner.os != 'Windows'
        run: ./install.sh --help
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "codex-router.ps1", "model-router.ps1", "deploy-codex-router.ps1", "restart-codex-router.ps1", "src/windows-process-tree.ps1", "scripts/build-electron-companion.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

  # The committed formula pins every resource in requirements/python.txt, so a
  # lock change with no version bump leaves it stale while still looking correct.
  # Only run when an input actually moved: the check queries PyPI once per
  # locked package, which is too much traffic to spend on unrelated pull
  # requests.
  homebrew-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Check whether the formula inputs changed
        id: changed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || 'HEAD^' }}"
          if git diff --quiet "$base" HEAD -- requirements/python.txt packaging/homebrew Formula; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.changed.outputs.run == 'true'
      - name: Verify the formula matches the Python lock
        if: steps.changed.outputs.run == 'true'
        run: node packaging/homebrew/check-formula.mjs
      - name: Set up Homebrew
        id: set-up-homebrew
        if: steps.changed.outputs.run == 'true'
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - name: Cache Homebrew Bundler RubyGems
        id: cache-homebrew-gems
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-
      - name: Install Homebrew Bundler RubyGems
        if: steps.changed.outputs.run == 'true' && steps.cache-homebrew-gems.outputs.cache-hit != 'true'
        run: brew install-bundler-gems
      - name: Audit the generated formula for Homebrew core
        if: steps.changed.outputs.run == 'true'
        run: packaging/homebrew/check-core-readiness.sh

  # A complete source build is intentionally manual because LiteLLM's locked
  # Python dependency tree is large. Run this on the candidate stable commit
  # before opening the homebrew/core pull request.
  homebrew-install:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - name: Build and test the formula from source
        run: packaging/homebrew/check-core-readiness.sh --install

  control-center:
    name: Electron control center (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
            builder_flag: --linux
            artifact_path: apps/control-center/release/codex-router-control-center-linux.tar.gz
          - platform: Windows
            os: windows-latest
            builder_flag: --win
            artifact_path: apps/control-center/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # Pull-request artifacts are deliberately unsigned and intended only for
      # testing against a matching Codex Router checkout/install.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: apps/control-center
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Install Electron dependencies
        run: npm ci
      - name: Check Electron sources
        run: npm run check
      - name: Test Electron integration
        run: npm test
      - name: Build the renderer
        run: npm run build
      - name: Package the native beta
        run: npx --no-install electron-builder ${{ matrix.builder_flag }}
      - name: Smoke the packaged Linux app
        if: runner.os == 'Linux'
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
        shell: bash
        run: |
          xvfb-run --auto-servernum bash -s <<'SMOKE'
          set -euo pipefail
          app="./release/linux-unpacked/codex-router-control-center"
          log="${RUNNER_TEMP}/control-center-linux.log"
          "$app" --no-sandbox --tray-only >"$log" 2>&1 &
          pid=$!
          trap 'kill -KILL "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            status=0
            wait "$pid" || status=$?
            cat "$log"
            echo "Packaged Linux app exited early with status $status." >&2
            exit 1
          fi
          if ! "$app" --no-sandbox; then
            cat "$log"
            echo "Second launch failed instead of handing off to the running app." >&2
            exit 1
          fi
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            echo "Normal launch did not hand off to the running tray process." >&2
            exit 1
          fi
          if ! "$app" --no-sandbox --quit-for-update; then
            cat "$log"
            echo "Controlled quit request returned a failure status." >&2
            exit 1
          fi
          for _ in {1..40}; do
            if ! kill -0 "$pid" 2>/dev/null; then
              if wait "$pid"; then
                status=0
              else
                status=$?
              fi
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                cat "$log"
                echo "Packaged Linux app stopped with status $status." >&2
                exit 1
              fi
              exit 0
            fi
            sleep 0.25
          done
          cat "$log"
          echo "Packaged Linux app did not stop after controlled quit." >&2
          exit 1
          SMOKE
      - name: Smoke the packaged Windows app
        if: runner.os == 'Windows'
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "control-center-windows.log"
          $stderr = Join-Path $env:RUNNER_TEMP "control-center-windows-error.log"
          $app = ".\release\win-unpacked\Codex Router.exe"
          $process = Start-Process $app `
            -ArgumentList "--tray-only" `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Packaged Windows app exited early with status $($process.ExitCode)."
            }
            $open = Start-Process $app -PassThru
            if (-not $open.WaitForExit(10000)) { throw "Second launch did not hand off to the running app." }
            if ($open.ExitCode -ne 0) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Second launch returned status $($open.ExitCode)."
            }
            Start-Sleep -Seconds 2
            $process.Refresh()
            if (-not $process.CloseMainWindow()) { throw "Second launch did not expose the Control Center window." }
            Start-Sleep -Seconds 2
            $process.Refresh()
            if ($process.HasExited) { throw "Closing the window also killed the tray process." }
            $quit = Start-Process $app -ArgumentList "--quit-for-update" -PassThru
            if (-not $quit.WaitForExit(10000)) { throw "Controlled quit request did not return." }
            if ($quit.ExitCode -ne 0) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Controlled quit request returned status $($quit.ExitCode)."
            }
            if (-not $process.WaitForExit(15000)) { throw "Tray process did not stop after controlled quit." }
            if ($process.ExitCode -ne 0) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw "Packaged Windows app stopped with status $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              $process.WaitForExit()
            }
          }
      - name: Preserve Linux executable permissions
        if: runner.os == 'Linux'
        working-directory: apps/control-center/release
        run: tar -czf codex-router-control-center-linux.tar.gz -- *.AppImage
      - name: Publish the unsigned beta package
        uses: actions/upload-artifact@v7
        with:
          name: codex-router-control-center-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  macos-unified-app:
    name: Unified native macOS app
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json
      - name: Build native tray with embedded Control Center
        env:
          MODEL_ROUTER_TRAY_UNIVERSAL: "1"
        run: scripts/build-macos-tray-app.sh "$RUNNER_TEMP/Codex Router.app"
      - name: Verify universal binaries, version, and complete bundle seal
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Codex Router.app"
          expected_control_version=$(node -p 'require("./apps/control-center/package.json").version')
          expected_short_version=${expected_control_version%%-*}
          actual_short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          actual_control_version=$(/usr/libexec/PlistBuddy -c 'Print :ModelRouterControlVersion' "$app/Contents/Info.plist")
          actual_build_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          test "$actual_short_version" = "$expected_short_version"
          test "$actual_control_version" = "$expected_control_version"
          test "$actual_build_version" = "$GITHUB_RUN_NUMBER"
          lipo "$app/Contents/MacOS/ModelRouterTray" -verify_arch x86_64 arm64
          widget="$app/Contents/PlugIns/RouterUsageWidget.appex"
          lipo "$widget/Contents/MacOS/RouterUsageWidget" -verify_arch x86_64 arm64
          lipo "$app/Contents/Resources/Control Center.app/Contents/MacOS/Codex Router" -verify_arch x86_64 arm64
          codesign --verify --deep --strict "$app"
          codesign -d --entitlements :- "$widget" > "$RUNNER_TEMP/widget-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :ModelRouterWidgetStorageMode' "$app/Contents/Info.plist")" = local
          test "$(/usr/libexec/PlistBuddy -c 'Print :ModelRouterWidgetStorageMode' "$widget/Contents/Info.plist")" = local
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.temporary-exception.files.home-relative-path.read-only:0' "$RUNNER_TEMP/widget-entitlements.plist")" = "/Library/Application Support/Codex Router Widget/"
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$RUNNER_TEMP/widget-entitlements.plist" >/dev/null 2>&1
          host_entitlements=$(codesign -d --entitlements :- "$app" 2>/dev/null || true)
          ! grep -q 'com.apple.security.application-groups' <<<"$host_entitlements"
          production_entitlements=apps/macos/RouterUsageWidget/RouterUsageWidget/RouterUsageWidget.entitlements
          local_entitlements=apps/macos/RouterUsageWidget/RouterUsageWidget/RouterUsageWidget.local.entitlements
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$production_entitlements")" = group.io.github.codex-router
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.temporary-exception.files.home-relative-path.read-only' "$production_entitlements" >/dev/null 2>&1
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.temporary-exception.files.home-relative-path.read-only:0' "$local_entitlements")" = "/Library/Application Support/Codex Router Widget/"
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups' "$local_entitlements" >/dev/null 2>&1
      - name: Smoke the unified macOS app lifecycle
        env:
          CODEX_ROUTER_SOURCE_ROOT: ${{ github.workspace }}
          MODEL_ROUTER_SKIP_SERVICE_MANAGER: "1"
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Codex Router.app"
          outer="$app/Contents/MacOS/ModelRouterTray"
          embedded="$app/Contents/Resources/Control Center.app/Contents/MacOS/Codex Router"
          log="$RUNNER_TEMP/model-router-macos-smoke.log"

          query_lifecycle() {
            /usr/bin/env -u ELECTRON_RUN_AS_NODE "$embedded" --query-lifecycle
          }

          wait_for_lifecycle() {
            expected_running=$1
            expected_ready=$2
            expected_visible=$3
            last_state=
            for _ in {1..120}; do
              last_state=$(query_lifecycle 2>/dev/null || true)
              if node -e '
                try {
                  const state = JSON.parse(process.argv[1]);
                  const expected = process.argv.slice(2).map((value) => value === "true");
                  process.exit(
                    state.running === expected[0]
                      && state.ready === expected[1]
                      && state.visible === expected[2]
                      ? 0 : 1
                  );
                } catch {
                  process.exit(1);
                }
              ' "$last_state" "$expected_running" "$expected_ready" "$expected_visible"; then
                printf '%s\n' "$last_state"
                return 0
              fi
              sleep 0.25
            done
            printf 'Timed out waiting for Control Center lifecycle %s/%s/%s; last state: %s\n' \
              "$expected_running" "$expected_ready" "$expected_visible" "$last_state" >&2
            cat "$log" >&2 || true
            return 1
          }

          bundle_count() {
            identifier=$1
            IDENTIFIER="$identifier" /usr/bin/osascript -l JavaScript -e '
              ObjC.import("AppKit");
              const identifier = $.NSProcessInfo.processInfo.environment.objectForKey("IDENTIFIER").js;
              String($.NSRunningApplication.runningApplicationsWithBundleIdentifier(identifier).count);
            '
          }

          terminate_bundle() {
            identifier=$1
            IDENTIFIER="$identifier" /usr/bin/osascript -l JavaScript -e '
              ObjC.import("AppKit");
              const identifier = $.NSProcessInfo.processInfo.environment.objectForKey("IDENTIFIER").js;
              const apps = $.NSRunningApplication.runningApplicationsWithBundleIdentifier(identifier);
              for (let index = 0; index < apps.count; index += 1) apps.objectAtIndex(index).terminate;
            ' >/dev/null
          }

          wait_for_bundle_exit() {
            identifier=$1
            for _ in {1..120}; do
              count=$(bundle_count "$identifier")
              case "$count" in *[!0-9]*|'') break ;; esac
              [ "$count" -eq 0 ] && return 0
              sleep 0.25
            done
            printf 'Timed out waiting for macOS bundle %s to exit.\n' "$identifier" >&2
            cat "$log" >&2 || true
            return 1
          }

          assert_single_outer_host() {
            count=$(bundle_count io.github.codex-router.tray)
            case "$count" in *[!0-9]*|'') count=invalid ;; esac
            if [ "$count" != 1 ]; then
              printf 'Expected one unified macOS host after reopen; found %s.\n' "$count" >&2
              cat "$log" >&2 || true
              return 1
            fi
          }

          "$outer" --supervised >"$log" 2>&1 &
          pid=$!
          cleanup() {
            cleanup_status=$?
            trap - EXIT
            terminate_bundle io.github.codex-router.control-center >/dev/null 2>&1 || true
            terminate_bundle io.github.codex-router.tray >/dev/null 2>&1 || true
            if kill -0 "$pid" 2>/dev/null; then
              kill -KILL "$pid" 2>/dev/null || true
            fi
            wait "$pid" 2>/dev/null || true
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          sleep 1
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            cat "$log"
            echo "Unified macOS host exited before its first reopen event." >&2
            exit 1
          fi

          /usr/bin/open "$app"
          first_state=$(wait_for_lifecycle true true true)
          assert_single_outer_host
          first_pid=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).pid))' "$first_state")

          # The embedded window can quit without taking its native tray owner
          # down, and opening the one outer app must create a fresh window host.
          terminate_bundle io.github.codex-router.control-center
          wait_for_lifecycle false false false >/dev/null
          kill -0 "$pid"
          /usr/bin/open "$app"
          second_state=$(wait_for_lifecycle true true true)
          assert_single_outer_host
          second_pid=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).pid))' "$second_state")
          test "$second_pid" != "$first_pid"

          # A normal quit of the outer app owns the complete lifetime: AppKit
          # stops the embedded Electron child and both processes exit cleanly.
          terminate_bundle io.github.codex-router.tray
          wait_for_bundle_exit io.github.codex-router.tray
          wait_for_lifecycle false false false >/dev/null
          if wait "$pid"; then
            :
          else
            status=$?
            cat "$log"
            echo "Unified macOS host exited with status $status." >&2
            exit "$status"
          fi
          trap - EXIT
      - name: Package the one visible application
        run: ditto -c -k --keepParent "$RUNNER_TEMP/Codex Router.app" "$RUNNER_TEMP/model-router-macos.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: model-router-macOS-${{ github.sha }}
          path: ${{ runner.temp }}/model-router-macos.zip
          if-no-files-found: error
          retention-days: 14
