name: CI

"on":
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: for file in install.sh bin/* scripts/build-desktop-tray.sh packaging/homebrew/check-core-readiness.sh; do [ "$(head -n 1 "$file")" != '#!/bin/sh' ] || sh -n "$file"; done
      - name: Check installer help
        if: runner.os != 'Windows'
        run: ./install.sh --help
      - name: Parse PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @("install.ps1", "codex-router.ps1", "model-router.ps1", "scripts/build-desktop-tray.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$null,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

  # The committed formula pins every resource in requirements/python.txt, so a
  # lock change with no version bump leaves it stale while still looking correct.
  # Only run when an input actually moved: the check queries PyPI once per
  # locked package, which is too much traffic to spend on unrelated pull
  # requests.
  homebrew-formula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Check whether the formula inputs changed
        id: changed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || 'HEAD^' }}"
          if git diff --quiet "$base" HEAD -- requirements/python.txt packaging/homebrew Formula; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.changed.outputs.run == 'true'
      - name: Verify the formula matches the Python lock
        if: steps.changed.outputs.run == 'true'
        run: node packaging/homebrew/check-formula.mjs
      - name: Set up Homebrew
        id: set-up-homebrew
        if: steps.changed.outputs.run == 'true'
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
      - name: Cache Homebrew Bundler RubyGems
        id: cache-homebrew-gems
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-
      - name: Install Homebrew Bundler RubyGems
        if: steps.changed.outputs.run == 'true' && steps.cache-homebrew-gems.outputs.cache-hit != 'true'
        run: brew install-bundler-gems
      - name: Audit the generated formula for Homebrew core
        if: steps.changed.outputs.run == 'true'
        run: packaging/homebrew/check-core-readiness.sh

  # A complete source build is intentionally manual because LiteLLM's locked
  # Python dependency tree is large. Run this on the candidate stable commit
  # before opening the homebrew/core pull request.
  homebrew-install:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49 # 2026.08.10.2
      - name: Build and test the formula from source
        run: packaging/homebrew/check-core-readiness.sh --install

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix apps/desktop
      - run: npm run check --prefix apps/desktop
      - run: npm run build:binary --prefix apps/desktop
